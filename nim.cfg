# Every engine is declared in `requires`, which is what lets nimble bring each
# one's own dependencies with it. Nothing is reached by sibling path any more.
#
# `src` is on the path because a module under it imports its siblings as
# `UniMedia/x`, which resolves against a search path rather than against the
# importing file. The tasks below pass it too; without it here, `nimble
# install` builds the `om` binary with no way to find them and fails on the
# first such import.
--path:"src"
--threads:on
